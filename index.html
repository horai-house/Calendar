<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>年間カレンダー | A4横印刷対応</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- アプリケーションヘッダー -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-section header-top-row">
        <h1 class="app-title">
          <span>📅 年間カレンダー</span>
          <span class="app-badge">A4横対応</span>
        </h1>

        <!-- 年度切り替え -->
        <div class="year-selector">
          <button id="prev-year-btn" class="year-btn" title="前年へ">◀</button>
          <div id="year-display" class="year-display">2027年</div>
          <button id="next-year-btn" class="year-btn" title="次年へ">▶</button>
        </div>

        <button id="today-btn" class="btn" style="padding: 4px 8px; font-size: 11px;">今日</button>
      </div>

      <!-- 表示タブ（上半期 / 下半期 / 通年） -->
      <div class="view-tabs">
        <button class="tab-btn active" data-period="first-half">上半期 (1〜6月)</button>
        <button class="tab-btn" data-period="second-half">下半期 (7〜12月)</button>
        <button class="tab-btn" data-period="full-year">通年 (1〜12月)</button>
      </div>

      <!-- 操作ボタン群 -->
      <div class="action-buttons">
        <div class="print-target-group">
          <label><input type="radio" name="print-target" value="current" checked> 現在の期(1枚)</label>
          <label><input type="radio" name="print-target" value="both"> 通年(2枚)</label>
        </div>
        <button id="print-btn" class="btn btn-primary" title="A4横向きで印刷します">
          🖨️ A4横 印刷
        </button>
      </div>
    </div>

    <!-- モバイル用月切り替えタブ（画面幅768px以下で自動表示） -->
    <div class="month-tabs-mobile" id="month-tabs-mobile">
      <!-- 1月〜12月ボタンが動的生成される -->
    </div>
  </header>

  <!-- カレンダーメイン領域 -->
  <main class="calendar-wrapper" id="calendar-wrapper">
    <!-- 上半期 (1〜6月) -->
    <section class="half-year-page" id="page-first-half">
      <div class="half-year-title">
        <span id="first-half-heading">2027年 上半期 (1月 〜 6月)</span>
        <span style="font-size: 11px; color: var(--text-muted);">A4横 1ページ目</span>
      </div>
      <div class="months-grid" id="grid-first-half">
        <!-- 1月〜6月のカラムが動的生成される -->
      </div>
    </section>

    <!-- 下半期 (7〜12月) -->
    <section class="half-year-page" id="page-second-half">
      <div class="half-year-title">
        <span id="second-half-heading">2027年 下半期 (7月 〜 12月)</span>
        <span style="font-size: 11px; color: var(--text-muted);">A4横 2ページ目</span>
      </div>
      <div class="months-grid" id="grid-second-half">
        <!-- 7月〜12月のカラムが動的生成される -->
      </div>
    </section>
  </main>

  <!-- カラー選択ポップオーバー（フローティング） -->
  <div id="color-popover" class="color-palette-popover" style="display: none;">
    <div class="color-option" data-color="" style="background: #ffffff; border: 1px dashed #999;" title="なし"></div>
    <div class="color-option tag-blue" data-color="blue" title="青（仕事・重要）"></div>
    <div class="color-option tag-green" data-color="green" title="緑（プライベート・外出）"></div>
    <div class="color-option tag-orange" data-color="orange" title="橙（会議・打合せ）"></div>
    <div class="color-option tag-red" data-color="red" title="赤（緊急・締切）"></div>
    <div class="color-option tag-purple" data-color="purple" title="紫（記念日・イベント）"></div>
  </div>

  <!-- スクリプト読込 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="holidays.js"></script>
  <script src="app.js"></script>
</body>
</html>
